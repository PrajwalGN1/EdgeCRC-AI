<text x="641.0" y="140.6">PHASE 2 — FEATURE ENGINEERING</text><text x="641.0" y="151.4">(Frozen Foundation Encoders)</text></g><g><rect fill="white" height="132" opacity="1" rx="12" ry="12" stroke="#10B981" stroke-width="1.3" width="366" x="458" y="192" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="8" font-weight="400" text-anchor="middle"><text x="641.0" y="241.8">Vision Encoder</text><text x="641.0" y="252.60000000000002">Phikon-v2 (DINOv2 ViT-L/16)</text><text x="641.0" y="263.40000000000003">307M params • 460M tiles</text><text x="641.0" y="274.20000000000005">V ∈ ℝ^{N×1024}  [N≤1000]</text></g><g><rect fill="white" height="132" opacity="1" rx="12" ry="12" stroke="#10B981" stroke-width="1.3" width="366" x="458" y="340" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="8" font-weight="400" text-anchor="middle"><text x="641.0" y="389.8">Text Encoder</text><text x="641.0" y="400.6">ClinicalBERT (110M)</text><text x="641.0" y="411.40000000000003">2M MIMIC-III notes</text><text x="641.0" y="422.20000000000005">T ∈ ℝ^{1×768}  →  [L×768]</text></g><g><rect fill="white" height="132" opacity="1" rx="12" ry="12" stroke="#10B981" stroke-width="1.3" width="366" x="458" y="488" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="8" font-weight="400" text-anchor="middle"><text x="641.0" y="537.8">Tensor Store</text><text x="641.0" y="548.5999999999999">clean_tensors/*.pt</text><text x="641.0" y="559.4">*_vision.pt  *_text.pt</text><text x="641.0" y="570.1999999999999">653 files • 326×2</text></g><line marker-end="url(#arrowhead)" stroke="#0B2C4A" stroke-linecap="round" stroke-width="1.6" x1="836" x2="860" y1="460" y2="460" /><g><rect fill="#FEF3C7" height="620" opacity="0.7" rx="16" ry="16" stroke="#F59E0B" stroke-width="1.2" width="390" x="860" y="120" /></g><g><rect fill="#F59E0B" height="