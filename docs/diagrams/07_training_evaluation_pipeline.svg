<svg baseProfile="full" height="1100" version="1.1" viewBox="0 0 1700 1100" width="1700" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="1100" width="1700" x="0" y="0" /><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle"><text x="850.0" y="48.0">TRAINING &amp; EVALUATION PIPELINE — Optimization, Metrics &amp; Loss Dynamics</text></g><line stroke="#E2E8F0" stroke-width="1" x1="32" x2="1668" y1="72" y2="72" /><rect fill="#0B2C4A" height="28" rx="8" width="520" x="32" y="84" /><g dominant-baseline="middle" fill="white" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" text-anchor="middle"><text x="292" y="98.0">TRAINING LOOP — 30 Epochs • 80/20 Split • Weighted BCE 4.17</text></g><g><rect fill="#EFF6FF" height="96" opacity="1" rx="12" ry="12" stroke="#3B82F6" stroke-width="1.4" width="172" x="32" y="132" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6" font-weight="700" text-anchor="middle"><text x="118" y="175.95">1. Seed</text><text x="118" y="184.04999999999998">set_seed(42)</text></g><g><rect fill="#F0FDF4" height="96" opacity="1" rx="12" ry="12" stroke="#10B981" stroke-width="1.4" width="172" x="220" y="132" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6" font-weight="700" text-anchor="middle"><text x="306" y="171.9">2. Dataset:</text><text x="306" y="180.0">326 patients</text><text x="306" y="188.10000000000002">63 MSI / 263 MSS</text></g><g><rect fill="#FEF3C7" height="96" opacity="1" rx="12" ry="12" stroke="#F59E0B" stroke-width="1.4" width="172" x="408" y="132" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6" font-weight="700" text-anchor="middle"><text x="494" y="171.9">3. Split:</text><text x="494" y="180.0">80% Train 261</text><text x="494" y="188.10000000000002">20% Val 65</text></g><g><rect fill="#EDE9FE" height="96" opacity="1" rx="12" ry="12" stroke="#8B5CF6" stroke-width="1.4" width="172" x="596" y="132" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6" font-weight="700" text-anchor="middle"><text x="682" y="171.9">4. DataLoader:</text><text x="682" y="180.0">batch=1</text><text x="682" y="188.10000000000002">max_patches=1000</text></g><g><rect fill="#ECFDF5" height="96" opacity="1" rx="12" ry="12" stroke="#10B981" stroke-width="1.4" width="172" x="784" y="132" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6" font-weight="700" text-anchor="middle"><text x="870" y="171.9">5. Model:</text><text x="870" y="180.0">CrossAttention</text><text x="870" y="188.10000000000002">8-head MHA</text></g><g><rect fill="#FEF3C7" height="96" opacity="1" rx="12" ry="12" stroke="#F59E0B" stroke-width="1.4" width="172" x="972" y="132" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6" font-weight="700" text-anchor="middle"><text x="1058" y="171.9">6. Forward:</text><text x="1058" y="180.0">prob, attn</text><text x="1058" y="188.10000000000002">Weighted BCE</text></g><g><rect fill="#FDF2F8" height="96" opacity="1" rx="12" ry="12" stroke="#EC4899" stroke-width="1.4" width="172" x="1160" y="132" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6" font-weight="700" text-anchor="middle"><text x="1246" y="175.95">7. Backward:</text><text x="1246" y="184.04999999999998">AdamW 1e-4</text></g><g><rect fill="#FFF7ED" height="96" opacity="1" rx="12" ry="12" stroke="#F97316" stroke-width="1.4" width="172" x="1348" y="132" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6" font-weight="700" text-anchor="middle"><text x="1434" y="171.9">8. Validate:</text><text x="1434" y="180.0">ROC-AUC</text><text x="1434" y="188.10000000000002">Save best</text></g><g><rect fill="#EFF6FF" height="96" opacity="1" rx="12" ry="12" stroke="#3B82F6" stroke-width="1.4" width="172" x="1536" y="132" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6" font-weight="700" text-anchor="middle"><text x="1622" y="175.95">9. Plot:</text><text x="1622" y="184.04999999999998">Loss 4.17</text></g><g><rect fill="white" height="48" opacity="1" rx="12" ry="12" stroke="#EF4444" stroke-width="1.4" width="1636" x="32" y="250" /></g><g dominant-baseline="middle" fill="#EF4444" font-family="Inter, Helvetica, Arial, sans-serif" font-size="8" font-weight="700" text-anchor="middle"><text x="850.0" y="274.0">WEIGHTED BCE:  L = −[ w⁺·y·log(ŷ) + (1−y)·log(1−ŷ) ]   w⁺ = 263/63 ≈ 4.17  (clamped ŷ∈[1e-7,1-1e-7])</text></g><g><rect fill="#1E293B" height="32" opacity="1" rx="8" ry="8" stroke="#1E293B" stroke-width="1.4" width="1636" x="32" y="310" /></g><g dominant-baseline="middle" fill="white" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" text-anchor="middle"><text x="850.0" y="326.0">DECISION:  Late Fusion τ=0.70  •  Cross-Attention τ=0.83 (conservative)  •  MSI if prob ≥ τ</text></g><rect fill="#0B2C4A" height="28" rx="8" width="1636" x="32" y="368" /><g dominant-baseline="middle" fill="white" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" text-anchor="middle"><text x="850.0" y="382.0">EVALUATION — Isolated Validation (66 patients) • No Leakage • Confusion Matrix + ROC</text></g><rect fill="#0B2C4A" height="32" rx="8" width="400" x="32" y="412" /><g dominant-baseline="middle" fill="white" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" text-ancho