<svg baseProfile="full" height="1000" version="1.1" viewBox="0 0 1800 1000" width="1800" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="1000" width="1800" x="0" y="0" /><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle"><text x="900.0" y="48.0">SEQUENCE DIAGRAMS — Training Pipeline (Top) &amp; Inference Pipeline (Bottom)</text></g><line stroke="#E2E8F0" stroke-width="1" x1="32" x2="1768" y1="72" y2="72" /><rect fill="#0B2C4A" height="28" rx="8" width="520" x="32" y="84" /><g dominant-baseline="middle" fill="white" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" text-anchor="middle"><text x="292" y="98.0">A. TRAINING PHASE — 30 Epochs • Weighted BCE • AdamW</text></g><g><rect fill="white" height="48" opacity="1" rx="12" ry="12" stroke="#0B2C4A" stroke-width="1.4" width="130" x="55" y="132" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" text-anchor="middle"><text x="120" y="151.275">DataLoader</text><text x="120" y="160.725">(Batch=1)</text></g><line stroke="#64748B" stroke-width="0.9" x1="120" x2="120" y1="180" y2="340" /><line stroke="#64748B" stroke-dasharray="6,4" stroke-width="0.9" x1="120" x2="120" y1="180" y2="340" /><g><rect fill="white" height="48" opacity="1" rx="12" ry="12" stroke="#0B2C4A" stroke-width="1.4" width="130" x="275" y="132" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" text-anchor="middle"><text x="340" y="151.275">Multimodal</text><text x="340" y="160.725">Dataset</text></g><line stroke="#64748B" stroke-width="0.9" x1="340" x2="340" y1="180" y2="340" /><line stroke="#64748B" stroke-dasharray="6,4" stroke-width="0.9" x1="340" x2="340" y1="180" y2="340" /><g><rect fill="white" height="48" opacity="1" rx="12" ry="12" stroke="#0B2C4A" stroke-width="1.4" width="130" x="495" y="132" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" text-anchor="middle"><text x="560" y="151.275">Phikon-v2</text><text x="560" y="160.725">(Frozen)</text></g><line stroke="#64748B" stroke-width="0.9" x1="560" x2="560" y1="180" y2="340" /><line stroke="#64748B" stroke-dasharray="6,4" stroke-width="0.9" x1="560" x2="560" y1="180" y2="340" /><g><rect fill="white" height="48" opacity="1" rx="12" ry="12" stroke="#0B2C4A" stroke-width="1.4" width="130" x="695" y="132" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" text-anchor="middle"><text x="760" y="151.275">ClinicalBERT</text><text x="760" y="160.725">(Frozen)</text></g><line stroke="#64748B" stroke-width="0.9" x1="760" x2="760" y1="180" y2="340" /><line stroke="#64748B" stroke-dasharray="6,4" stroke-width="0.9" x1="760" x2="760" y1="180" y2="340" /><g><rect fill="white" height="48" opacity="1" rx="12" ry="12" stroke="#0B2C4A" stroke-width="1.4" width="130" x="935" y="132" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" text-anchor="middle"><text x="1000" y="151.275">Cross-Attention</text><text x="1000" y="160.725">Model</text></g><line stroke="#64748B" stroke-width="0.9" x1="1000" x2="1000" y1="180" y2="340" /><line stroke="#64748B" stroke-dasharray="6,4" stroke-width="0.9" x1="1000" x2="1000" y1="180" y2="340" /><g><rect fill="white" height="48" opacity="1" rx="12" ry="12" stroke="#0B2C4A" stroke-width="1.4" width="130" x="1175" y="132" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" text-anchor="middle"><text x="1240" y="151.275">Weighted</text><text x="1240" y="160.725">BCE Loss</text></g><line stroke="#64748B" stroke-width="0.9" x1="1240" x2="1240" y1="180" y2="340" /><line stroke="#64748B" stroke-dasharray="6,4" stroke-width="0.9" x1="1240" x2="1240" y1="180" y2="340" /><g><rect fill="white" height="48" opacity="1" rx="12" ry="12" stroke="#0B2C4A" stroke-width="1.4" width="130" x="1415" y="132" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" text-anchor="middle"><text x="1480" y="151.275">AdamW</text><text x="1480" y="160.725">Optimizer</text></g><line stroke="#64748B" stroke-width="0.9" x1="1480" x2="1480" y1="180" y2="340" /><line stroke="#64748B" stroke-dasharray="6,4" stroke-width="0.9" x1="1480" x2="1480" y1="180" y2="340" /><line stroke="#0B2C4A" stroke-width="1.4" x1="120" x2="340" y1="210" y2="210" /><polygon fill="#0B2C4A" points="340,210 332,206 332,214" /><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6" font-weight="700" text-anchor="middle"><text x="230" y="202.0">1. __getitem__(idx) → {vision [N×1024], text [768], label}</text></g><g dominant-baseline="middle" fill="#64748B" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6" font-weight="400" text-anchor="middle"><text x="230" y="232.0">2. Dynamic cap: randperm 1000 if N&gt;1000</text></g><line stroke="#3B82F6" stroke-width="1.4" x1="120" x2="1000" y1="260" y2="260" /><polygon fill="#3B82F6" points="1000,260 992,256 992,264" /><g dominant-baseline="middle" fill="#3B82F6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6" font-weight="700" text-anchor="middle"><text x="560" y="252.0">3. vision [1×N×1024] + text [1×768] → forward()</text></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6" font-weight="400" text-anchor="middle"><text x="1000" y="286.0">4. Text Proj 768→1024 + 8-head Cross-Attn + LayerNorm</text></g><line stroke="#F59E0B" stroke-width="1.4" x1="1000" x2="1240" y1="310" y2="310" /><polygon fill="#F59E0B" points="1240,310 1232,306 1232,314" /><g dominant-baseline="middle" fill="#92400E" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6" font-weight="700" text-anchor="middle"><text x="1120" y="302.0">5. prob + attn_weights</text></g><line stroke="#EF4444" stroke-width="1.4" x1="1000" x2="1240" y1="330" y2="330" /><polygon fill="#EF4444" points="1240,330 1232,326 1232,334" /><g dominant-baseline="middle" fill="#EF4444" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6" font-weight="700" text-anchor="middle"><text x="1120" y="322.0">6. L = -[4.17·y·log(p)+(1-y)·log(1-p)]</text></g><g><rect fill="#F1F5F9" height="28" opacity="1" rx="8" ry="8" stroke="#E2E8F0" stroke-width="1.4" width="920" x="440" y="352" /></g><g dominant-baseline="middle" fill="#64748B" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6" font-weight="400" text-anchor="middle"><text x="900" y="366.0">Loop: Train 261 → Val 65 — early stopping on best AUC → Save best_fusion_model.pth</text></g><rect fill="#8B5CF6" height="28" rx="8" width="540" x="32" y="400" /><g dominant-baseline="middle" fill="white" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" text-anchor="middle"><text x="302" y="414.0">B. INFERENCE PHASE — Streamlit → Model → XAI → LLM Scribe</text></g><g><rect fill="white" height="48" opacity="1" rx="12" ry="12" stroke="#8B5CF6" stroke-width="1.4" width="130" x="55" y="448" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" text-anchor="middle"><text x="120" y="467.275">Clinician</text><text x="120" y="476.72499999999997">(Browser)</text></g><line stroke="#64748B" stroke-dasharray="6,4" stroke-width="0.9" x1="120" x2="120" y1="496" y2="700" /><g><rect fill="white" height="48" opacity="1" rx="12" ry="12" stroke="#8B5CF6" stroke-width="1.4" width="130" x="295" y="448" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" text-anchor="middle"><text x="360" y="467.275">Streamlit</text><text x="360" y="476.72499999999997">UI (app.py)</text></g><line stroke="#64748B" stroke-dasharray="6,4" stroke-width="0.9" x1="360" x2="360" y1="496" y2="700" /><g><rect fill="white" height="48" opacity="1" rx="12" ry="12" stroke="#8B5CF6" stroke-width="1.4" width="130" x="535" y="448" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" text-anchor="middle"><text x="600" y="467.275">Cross-Attention</text><text x="600" y="476.72499999999997">Model</text></g><line stroke="#64748B" stroke-dasharray="6,4" stroke-width="0.9" x1="600" x2="600" y1="496" y2="700" /><g><rect fill="white" height="48" opacity="1" rx="12" ry="12" stroke="#8B5CF6" stroke-width="1.4" width="130" x="795" y="448" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" text-anchor="middle"><text x="860" y="467.275">Phikon-v2</text><text x="860" y="476.72499999999997">ViT Rollout</text></g><line stroke="#64748B" stroke-dasharray="6,4" stroke-width="0.9" x1="860" x2="860" y1="496" y2="700" /><g><rect fill="white" height="48" opacity="1" rx="12" ry="12" stroke="#8B5CF6" stroke-width="1.4" width="130" x="1055" y="448" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" text-anchor="middle"><text x="1120" y="467.275">Ollama</text><text x="1120" y="476.72499999999997">Qwen 2.5</text></g><line stroke="#64748B" stroke-dasharray="6,4" stroke-width="0.9" x1="1120" x2="1120" y1="496" y2="700" /><g><rect fill="white" height="48" opacity="1" rx="12" ry="12" stroke="#8B5CF6" stroke-width="1.4" width="130" x="1355" y="448" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" text-anchor="middle"><text x="1420" y="467.275">File System</text><text x="1420" y="476.72499999999997">(Assets)</text></g><line stroke="#64748B" stroke-dasharray="6,4" stroke-width="0.9" x1="1420" x2="1420" y1="496" y2="700" /><line stroke="#8B5CF6" stroke-width="1.4" x1="120" x2="360" y1="540" y2="540" /><polygon fill="#8B5CF6" points="360,540 352,536 352,544" /><g dominant-baseline="middle" fill="#8B5CF6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6" font-weight="700" text-anchor="middle"><text x="240" y="532.0">1. Enter Patient ID + edit report</text></g><line stroke="#0B2C4A" stroke-width="1.4" x1="360" x2="600" y1="580" y2="580" /><polygon fill="#0B2C4A" points="600,580 592,576 592,584" /><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6" font-weight="700" text-anchor="middle"><text x="480" y="572.0">2. Load *_vision.pt + *_text.pt → forward()</text></g><line stroke="#10B981" stroke-width="1.4" x1="600" x2="360" y1="620" y2="620" /><polygon fill="#10B981" points="360,620 368,616 368,624" /><g dominant-baseline="middle" fill="#10B981" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6" font-weight="700" text-anchor="middle"><text x="480" y="612.0">3. Return prob=0.87 + attn_weights [1×N]</text></g><g dominant-baseline="middle" fill="#64748B" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6" font-weight="400" text-anchor="middle"><text x="600" y="656.0">4a. argsort → Top-5 → Gallery   |   4b. Phikon rollout (6 layers, Jet dark) • 5. Ollama POST → 6. 3-paragraph report</text></g><g><rect fill="#EDE9FE" height="28" opacity="1" rx="8" ry="8" stroke="#C4B5FD" stroke-width="1.4" width="920" x="440" y="680" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" text-anchor="middle"><text x="900" y="694.0">7. Render: Probability meter + Top-5 gallery + Dark heatmap + Scribe report (tissue-aware)</text></g></svg>