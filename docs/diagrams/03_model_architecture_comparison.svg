<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1000" version="1.1" viewBox="0 0 1800 1000" width="1800" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="1000" width="1800" x="0" y="0" /><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle"><text x="900.0" y="40.0">MODEL ARCHITECTURE — Late Fusion (Baseline) vs. SummaryToPatchCrossAttention (Primary)</text></g><line stroke="#E2E8F0" stroke-width="1" x1="32" x2="1768" y1="60" y2="60" /><g dominant-baseline="middle" fill="#9A3412" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle"><text x="450.0" y="84.0">A. Late Fusion Baseline — AB-MIL + Concat + MLP</text></g><g><rect fill="#F97316" height="14" rx="7" stroke="#F97316" stroke-width="1" width="49.6" x="755.2" y="77.0" /><text dominant-baseline="middle" fill="white" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6.5" font-weight="600" text-anchor="middle" x="780.0" y="84.5">BASELINE</text></g><g><rect fill="#EFF6FF" height="72" opacity="1" rx="12" ry="12" stroke="#3B82F6" stroke-width="1.4" width="220" x="32" y="100" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" text-anchor="middle"><text x="142" y="126.55">INPUT A: Vision</text><text x="142" y="136.0">V ∈ ℝ^{1×N×1024}</text><text x="142" y="145.45">N patches (var., ≤1000)</text></g><g><rect fill="#FDF2F8" height="72" opacity="1" rx="12" ry="12" stroke="#EC4899" stroke-width="1.4" width="220" x="648.0" y="100" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" text-anchor="middle"><text x="758.0" y="126.55">INPUT B: Text</text><text x="758.0" y="136.0">T ∈ ℝ^{1×768}</text><text x="758.0" y="145.45">[CLS] vector</text></g><g><rect fill="white" height="84" opacity="1" rx="12" ry="12" stroke="#3B82F6" stroke-width="1.4" width="220" x="32" y="192" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6" font-weight="400" text-anchor="middle"><text x="142" y="221.85">AB-MIL Attention</text><text x="142" y="229.95">Linear(1024→512) → Tanh</text><text x="142" y="238.05">Linear(512→1) → Softmax</text><text x="142" y="246.15">A ∈ ℝ^{N×1}, ΣA=1.0</text></g><g><rect fill="#DBEAFE" height="48" opacity="1" rx="12" ry="12" stroke="#3B82F6" stroke-width="1.4" width="220" x="32" y="292" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" text-anchor="middle"><text x="142" y="311.275">Weighted Sum</text><text x="142" y="320.72499999999997">vision_summary = Aᵀ·V → [1×1024]</text></g><g><rect fill="white" height="84" opacity="1" rx="12" ry="12" stroke="#EC4899" stroke-width="1.4" width="220" x="648.0" y="192" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6" font-weight="400" text-anchor="middle"><text x="758.0" y="221.85">Text Projector</text><text x="758.0" y="229.95">Linear(768→512) → ReLU</text><text x="758.0" y="238.05">Dropout(0.3)</text><text x="758.0" y="246.15">[1×512]</text></g><g><rect fill="#FCE7F3" height="48" opacity="1" rx="12" ry="12" stroke="#EC4899" stroke-width="1.4" width="220" x="648.0" y="292" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" text-anchor="middle"><text x="758.0" y="316.0">text_summary [1×512]</text></g><g><rect fill="#FEF3C7" height="72" opacity="1" rx="12" ry="12" stroke="#F59E0B" stroke-width="1.4" width="280" x="310.0" y="380" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="8" font-weight="700" text-anchor="middle"><text x="450.0" y="410.6">CONCATENATE</text><text x="450.0" y="421.40000000000003">fused = [vision; text] → [1×1536]</text></g><g dominant-baseline="middle" fill="#64748B" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6" font-weight="400" text-anchor="middle"><text x="450.0" y="466.0">Static fusion — no inter-modal interaction</text></g><g><rect fill="white" height="84" opacity="1" rx="12" ry="12" stroke="#F59E0B" stroke-width="1.4" width="320" x="290.0" y="492" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" text-anchor="middle"><text x="450.0" y="524.55">CLASSIFIER HEAD</text><text x="450.0" y="534.0">Linear(1536→256) → ReLU → Dropout(0.3)</text><text x="450.0" y="543.4499999999999">Linear(256→1) → Sigmoid → prob</text></g><g><rect fill="#FFFBEB" height="44" opacity="1" rx="10" ry="10" stroke="#F59E0B" stroke-width="1.4" width="360" x="270.0" y="596" /></g><g dominant-baseline="middle" fill="#64748B" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6" font-weight="600" text-anchor="middle"><text x="450.0" y="618.0">XAI: prob + AB-MIL weights A (patch ranking)</text></g><g><rect fill="#FFF7ED" height="48" opacity="1" rx="12" ry="12" stroke="#F97316" stroke-width="1.4" width="820.0" x="40" y="656" /></g><g dominant-baseline="middle" fill="#9A3412" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" text-anchor="middle"><text x="450.0" y="680.0">PERF: Acc 81.82% • AUC 0.895 • MSI F1 0.50 (Recall 0.38)</text></g><g dominant-baseline="middle" fill="#DC2626" font-family="Inter, Helvetica, Arial, sans-serif" font-size="5" font-weight="700" text-anchor="middle"><text x="32" y="90.0">⚠ ISOLATED BRANCHES — text cannot guide vision</text></g><g dominant-baseline="middle" fill="#065F46" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle"><text x="1350.0" y="84.0">B. SummaryToPatchCrossAttention — Intermediate Dynamic Fusion ★ PRIMARY</text></g><g><rect fill="#10B981" height="14" rx="7" stroke="#10B981" stroke-width="1" width="53.800000000000004" x="1653.1" y="77.0" /><text dominant-baseline="middle" fill="white" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6.5" font-weight="600" text-anchor="middle" x="1680" y="84.5">PRIMARY ★</text></g><g><rect fill="#EFF6FF" height="72" opacity="1" rx="12" ry="12" stroke="#3B82F6" stroke-width="1.4" width="220" x="932.0" y="100" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" text-anchor="middle"><text x="1042.0" y="131.275">Vision V [B×N×1024]</text><text x="1042.0" y="140.725">(uncompressed)</text></g><g><rect fill="#FDF2F8" height="72" opacity="1" rx="12" ry="12" stroke="#EC4899" stroke-width="1.4" width="220" x="1548" y="100" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" text-anchor="middle"><text x="1658" y="131.275">Text T [B×768]</text><text x="1658" y="140.725">[CLS] → [B×1×768]</text></g><g><rect fill="white" height="60" opacity="1" rx="12" ry="12" stroke="#EC4899" stroke-width="1.4" width="260" x="1520" y="192" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6" font-weight="700" text-anchor="middle"><text x="1650" y="217.95">① TEXT PROJECTION</text><text x="1650" y="226.04999999999998">Linear(768→1024)  T' = T·W → [B×1×1024]</text></g><g><rect fill="#0B2C4A" height="140" opacity="1" rx="16" ry="16" stroke="#0B2C4A" stroke-width="1.4" width="520" x="940.0" y="280" /></g><g dominant-baseline="middle" fill="white" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" text-anchor="middle"><text x="1200.0" y="304.0">② MULTI-HEAD CROSS-ATTENTION  (8 heads • batch_first=True)</text></g><rect fill="#FCE7F3" height="28" rx="8" stroke="white" width="140" x="940.0" y="324" /><g dominant-baseline="middle" fill="#9D174D" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6" font-weight="700" text-anchor="middle"><text x="1010.0" y="338.0">Q = T'  [B×1×1024]</text></g><rect fill="#DBEAFE" height="28" rx="8" stroke="white" width="140" x="1130.0" y="324" /><g dominant-baseline="middle" fill="#1E40AF" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6" font-weight="700" text-anchor="middle"><text x="1200.0" y="338.0">K = V  [B×N×1024]</text></g><rect fill="#DBEAFE" height="28" rx="8" stroke="white" width="140" x="1320.0" y="324" /><g dominant-baseline="middle" fill="#1E40AF" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6" font-weight="700" text-anchor="middle"><text x="1390.0" y="338.0">V = V  [B×N×1024]</text></g><rect fill="#1E293B" height="28" rx="8" stroke="#334155" width="420" x="990.0" y="364" /><g dominant-baseline="middle" fill="#FDE68A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="8" font-weight="700" text-anchor="middle"><text x="1200.0" y="378.0">Attn(Q,K,V) = softmax( QKᵀ / √1024 ) · V</text></g><g dominant-baseline="middle" fill="white" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6" font-weight="400" text-anchor="middle"><text x="1200.0" y="400.0">→ attn_output [B×1×1024]  +  attn_weights [B×1×N]  (interpretable!)</text></g><g><rect fill="#FEF3C7" height="40" opacity="1" rx="12" ry="12" stroke="#F59E0B" stroke-width="1.4" width="520" x="940.0" y="436" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" text-anchor="middle"><text x="1200.0" y="456.0">③ RESIDUAL + LAYERNORM  —  fused = LayerNorm(T' + attn_output)</text></g><g><rect fill="white" height="64" opacity="1" rx="12" ry="12" stroke="#10B981" stroke-width="1.4" width="520" x="940.0" y="492" /></g><g dominant-baseline="middle" fill="#0B2C4A" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6" font-weight="700" text-anchor="middle"><text x="1200.0" y="524.0">④ SQUEEZE + CLASSIFIER  —  pooled [B×1024] → Linear(1024→256) → ReLU → Dropout → Linear→Sigmoid</text></g><g dominant-baseline="middle" fill="#64748B" font-family="Inter, Helvetica, Arial, sans-serif" font-size="6" font-weight="600" text-anchor="middle"><text x="1200.0" y="576.0">prob ∈ [0,1] + attn_weights  •  Decision: MSI if prob ≥ 0.83 else MSS</text></g><g><rect fill="#ECFDF5" height="48" opacity="1" rx="12" ry="12" stroke="#10B981" stroke-width="1.4" width="480" x="960.0" y="596" /></g><g dominant-baseline="middle" fill="#065F46" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" text-anchor="middle"><text x="1200.0" y="620.0">PERF: Acc 89.39% • AUC 0.9150 • MSI F1 0.77 (Recall 0.75)</text></g><g dominant-baseline="middle" fill="#065F46" font-family="Inter, Helvetica, Arial, sans-serif" font-size="5" font-weight="700" text-anchor="middle"><text x="932.0" y="90.0">✓ DYNAMIC TEXT-GUIDED VISUAL SEARCH — rollout product, tissue mask</text></g></svg>